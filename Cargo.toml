[package]
name = "gmellon"
version = "0.1.0"
edition = "2024"

[dependencies]
bon = "3.10.1"
clap = { version = "4.6.6", features = ["derive"] }
firmament = { version = "0.1.0", path = "../firmament" }
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "real_daemon"
path = "tests/harness/real_daemon.rs"

[[test]]
name = "broker_collections"
path = "tests/harness/broker_collections.rs"
