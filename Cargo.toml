[package]
name = "gmellon"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
clap = { version = "4.6.6", features = ["derive"] }
crypto-bigint = { version = "0.7.5", features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["net", "process"] }
sha2 = "0.11.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "real_daemon"
path = "tests/harness/real_daemon.rs"

[[test]]
name = "broker_collections"
path = "tests/harness/broker_collections.rs"

[[test]]
name = "broker_cli"
path = "tests/harness/broker_cli.rs"

[[test]]
name = "redaction_scan"
path = "tests/harness/redaction_scan.rs"
