[package]
name = "gmellon"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
clap = { version = "4.6.6", features = ["derive"] }
crypto-bigint = { version = "0.7.5", features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
rpassword = "7.5.4"
# Non-optional only for `io::Errno` (ENXIO classification in secret_input);
# the control backend's net/process surfaces are activated by `login-control`.
rustix = "1.1.4"
sha2 = "0.11.0"
# Redacted diagnostics: spans/events carry operations, results, and lengths
# only — never password bytes, key material, IVs, or ciphertext bodies.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.9.0"

[features]
# The login-only control-socket backend: library-only, never a fallback.
# Default builds omit the control codec/client and rustix's net/process
# features entirely.
login-control = ["rustix/net", "rustix/process"]

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "real_daemon"
path = "tests/harness/real_daemon.rs"

[[test]]
name = "broker_collections"
path = "tests/harness/broker_collections.rs"

[[test]]
name = "broker_cli"
path = "tests/harness/broker_cli.rs"

[[test]]
name = "redaction_scan"
path = "tests/harness/redaction_scan.rs"
